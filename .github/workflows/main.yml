                                  color = Color(0xFF1E293B),
                                  shape = RoundedCornerShape(16.dp),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Row(
                                      modifier = Modifier.padding(horizontal = 16.dp, vertical = 12.dp),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Column(modifier = Modifier.weight(1f)) {
                                          Text("تأثير ساندوتش العمق", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color.White)
                                          Text("إخفاء جزء من أرقام الساعة خلف الشخصية", fontSize = 11.sp, color = Color(0xFF94A3B8))
                                      }
                                      Switch(
                                          checked = clockConfig.isBehindSubject,
                                          onCheckedChange = {
                                              clockConfig = clockConfig.copy(isBehindSubject = it)
                                              repo.saveClockConfig(clockConfig)
                                          },
                                          colors = SwitchDefaults.colors(checkedThumbColor = Color.White, checkedTrackColor = Color(0xFF0284C7))
                                      )
                                  }
                              }

                              Spacer(modifier = Modifier.height(16.dp))

                              // اختيار نوع الخط
                              Text("نوع الخط (Font Family):", fontSize = 13.sp, color = Color(0xFF94A3B8))
                              Spacer(modifier = Modifier.height(8.dp))
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  fontOptions.take(2).forEach { (label, key) ->
                                      val isSelected = clockConfig.fontFamily == key
                                      Surface(
                                          onClick = {
                                              clockConfig = clockConfig.copy(fontFamily = key)
                                              repo.saveClockConfig(clockConfig)
                                          },
                                          color = if (isSelected) Color(0xFF0284C7) else Color(0xFF1E293B),
                                          shape = RoundedCornerShape(12.dp),
                                          modifier = Modifier.weight(1f).height(42.dp)
                                      ) {
                                          Box(contentAlignment = Alignment.Center) {
                                              Text(label, fontSize = 12.sp, fontWeight = FontWeight.Bold, color = Color.White)
                                          }
                                      }
                                  }
                              }
                              Spacer(modifier = Modifier.height(6.dp))
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  fontOptions.drop(2).forEach { (label, key) ->
                                      val isSelected = clockConfig.fontFamily == key
                                      Surface(
                                          onClick = {
                                              clockConfig = clockConfig.copy(fontFamily = key)
                                              repo.saveClockConfig(clockConfig)
                                          },
                                          color = if (isSelected) Color(0xFF0284C7) else Color(0xFF1E293B),
                                          shape = RoundedCornerShape(12.dp),
                                          modifier = Modifier.weight(1f).height(42.dp)
                                      ) {
                                          Box(contentAlignment = Alignment.Center) {
                                              Text(label, fontSize = 12.sp, fontWeight = FontWeight.Bold, color = Color.White)
                                          }
                                      }
                                  }
                              }

                              Spacer(modifier = Modifier.height(16.dp))

                              // ألوان الساعة
                              Text("لون الساعة والتاريخ:", fontSize = 13.sp, color = Color(0xFF94A3B8))
                              Spacer(modifier = Modifier.height(8.dp))
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween
                              ) {
                                  colorPresets.forEach { color ->
                                      val isSelected = clockConfig.colorArgb == color.toArgb()
                                      Box(
                                          modifier = Modifier
                                              .size(34.dp)
                                              .clip(CircleShape)
                                              .background(color)
                                              .clickable {
                                                  clockConfig = clockConfig.copy(colorArgb = color.toArgb())
                                                  repo.saveClockConfig(clockConfig)
                                              }
                                              .border(
                                                  width = if (isSelected) 3.dp else 1.dp,
                                                  color = if (isSelected) Color(0xFF38BDF8) else Color(0xFF475569),
                                                  shape = CircleShape
                                              )
                                      )
                                  }
                              }

                              Spacer(modifier = Modifier.height(16.dp))

                              // سلايدر الموضع الرأسي
                              Text("موضع الساعة الرأسي (خلف الرأس):", fontSize = 13.sp, color = Color(0xFF94A3B8))
                              Slider(
                                  value = clockConfig.verticalBias,
                                  onValueChange = {
                                      clockConfig = clockConfig.copy(verticalBias = it)
                                      repo.saveClockConfig(clockConfig)
                                  },
                                  valueRange = 0.12f..0.50f,
                                  colors = SliderDefaults.colors(thumbColor = Color(0xFF38BDF8), activeTrackColor = Color(0xFF0284C7))
                              )

                              // سلايدر حجم الخط
                              Text("حجم خط الساعة (${clockConfig.fontSizeSp.toInt()} sp):", fontSize = 13.sp, color = Color(0xFF94A3B8))
                              Slider(
                                  value = clockConfig.fontSizeSp,
                                  onValueChange = {
                                      clockConfig = clockConfig.copy(fontSizeSp = it)
                                      repo.saveClockConfig(clockConfig)
                                  },
                                  valueRange = 55f..125f,
                                  colors = SliderDefaults.colors(thumbColor = Color(0xFF38BDF8), activeTrackColor = Color(0xFF0284C7))
                              )

                              // سلايدر قوة تأثير الحركة 3D
                              Text("قوة تأثير الحركة ثلاثية الأبعاد (3D Parallax):", fontSize = 13.sp, color = Color(0xFF94A3B8))
                              Slider(
                                  value = clockConfig.parallaxStrength,
                                  onValueChange = {
                                      clockConfig = clockConfig.copy(parallaxStrength = it)
                                      repo.saveClockConfig(clockConfig)
                                  },
                                  valueRange = 0.0f..2.5f,
                                  colors = SliderDefaults.colors(thumbColor = Color(0xFF38BDF8), activeTrackColor = Color(0xFF0284C7))
                              )

                              Divider(modifier = Modifier.padding(vertical = 12.dp), color = Color(0xFF1E293B))

                              // 3. فحص وتحليل الطبقات (Layer Inspection)
                              Text("فحص وتحليل الطبقات (Layer Inspection):", fontSize = 13.sp, fontWeight = FontWeight.Bold, color = Color.White)
                              Spacer(modifier = Modifier.height(10.dp))
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  FilterChip(
                                      selected = showBgLayer,
                                      onClick = { showBgLayer = !showBgLayer },
                                      label = { Text("طبقة الخلفية", fontSize = 11.sp) },
                                      leadingIcon = { Icon(if (showBgLayer) Icons.Default.Visibility else Icons.Default.VisibilityOff, contentDescription = null, modifier = Modifier.size(16.dp)) },
                                      modifier = Modifier.weight(1f)
                                  )
                                  FilterChip(
                                      selected = showFgLayer,
                                      onClick = { showFgLayer = !showFgLayer },
                                      label = { Text("عنصر المقدمة", fontSize = 11.sp) },
                                      leadingIcon = { Icon(if (showFgLayer) Icons.Default.Visibility else Icons.Default.VisibilityOff, contentDescription = null, modifier = Modifier.size(16.dp)) },
                                      modifier = Modifier.weight(1f)
                                  )
                              }
                              Spacer(modifier = Modifier.height(6.dp))
                              FilterChip(
                                  selected = showClockLayer,
                                  onClick = { showClockLayer = !showClockLayer },
                                  label = { Text("ساعة قفل الشاشة", fontSize = 11.sp) },
                                  leadingIcon = { Icon(if (showClockLayer) Icons.Default.Visibility else Icons.Default.VisibilityOff, contentDescription = null, modifier = Modifier.size(16.dp)) },
                                  modifier = Modifier.fillMaxWidth()
                              )
                          }
                      }

                      Spacer(modifier = Modifier.height(90.dp))
                  }
              }
          }

          @Composable
          fun ClockViewPreview(config: ClockConfig, shiftX: androidx.compose.ui.unit.Dp, shiftY: androidx.compose.ui.unit.Dp) {
              val timeFormat = if (config.is24HourFormat) "HH:mm" else "hh:mm"
              val timeStr = remember { SimpleDateFormat(timeFormat, Locale.getDefault()).format(Date()) }
              val dateStr = remember { SimpleDateFormat("EEEE، d MMMM", Locale("ar")).format(Date()) }

              val chosenFontFamily = when (config.fontFamily) {
                  "SERIF" -> FontFamily.Serif
                  "MONOSPACE" -> FontFamily.Monospace
                  "SANS_SERIF" -> FontFamily.SansSerif
                  else -> FontFamily.Default
              }

              Box(
                  modifier = Modifier.fillMaxSize(),
                  contentAlignment = Alignment.TopCenter
              ) {
                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally,
                      modifier = Modifier
                          .padding(top = (390 * config.verticalBias).dp)
                          .offset(shiftX, shiftY)
                  ) {
                      Text(
                          text = timeStr,
                          color = Color(config.colorArgb),
                          fontSize = (config.fontSizeSp * 0.58f).sp,
                          fontWeight = FontWeight.Bold,
                          fontFamily = chosenFontFamily,
                          letterSpacing = (-1).sp
                      )
                      Text(
                          text = dateStr,
                          color = Color(config.colorArgb).copy(alpha = 0.85f),
                          fontSize = 12.sp,
                          fontWeight = FontWeight.Medium
                      )
                  }
              }
          }

          fun launchWallpaper(context: Context) {
              try {
                  val intent = Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).apply {
                      putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT, ComponentName(context, DepthWallpaperService::class.java))
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  context.startActivity(intent)
              } catch (e: ActivityNotFoundException) {
                  try {
                      val intent = Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(intent)
                  } catch (e2: Exception) {
                      Toast.makeText(context, "يرجى تعيين الخلفية من إعدادات شاشة الهاتف", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF

      # 5. بناء ملف الـ APK بنمط Debug عبر Gradle المباشر
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      # 6. رفع ملف الـ APK الناتج للتحميل المباشر
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iDroid-Depth-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
