name: Build Depth Wallpapers APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # 1. Checkout repository code (including new Compose UI and models)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Gradle 8.5
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # 4. Accept Android SDK Licenses & Configure local.properties
      - name: Accept Android SDK Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a32ee33ef4a11043e690b4f7462" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"

      # 5. Build Debug APK using repository sources
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      # 6. Upload APK Artifact for direct download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Depth-Wallpapers-v2-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
