name: Build iDroid-Depth APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. تثبيت وضبط Gradle 8.5 الرسمي
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # 4. توليد هيكل وأكواد مشروع الأندرويد كاملة
      - name: Scaffold Android Project
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/example/depthlockscreen/data/model
          mkdir -p app/src/main/java/com/example/depthlockscreen/data/repository
          mkdir -p app/src/main/java/com/example/depthlockscreen/ml
          mkdir -p app/src/main/java/com/example/depthlockscreen/service
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # قبول تراخيص Android SDK وتحديد مسار الـ SDK
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a32ee33ef4a11043e690b4f7462" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"

          # ضبط gradle.properties لتفعيل AndroidX وتحسين الذاكرة
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "iDroid-Depth"
          include(":app")
          EOF

          # 2. build.gradle.kts (المستوى الجذري)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 3. gradle-wrapper.properties
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.depthlockscreen"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.depthlockscreen"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  debug {
                      applicationIdSuffix = ".debug"
                      isDebuggable = true
                  }
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              
              // Google ML Kit Subject Segmentation
              implementation("com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1")
              implementation("com.google.mlkit:vision-common:17.3.0")
              
              // Kotlin Coroutines
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3")
          }
          EOF

          # 5. Strings & Wallpaper XML
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">iDroid Depth</string>
              <string name="wallpaper_author">Gautier Studio</string>
              <string name="wallpaper_description">3D Depth Effect Live Wallpaper with Parallax and Clock</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/wallpaper.xml
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_description"
              android:author="@string/wallpaper_author"
              android:settingsActivity="com.example.depthlockscreen.MainActivity" />
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.SET_WALLPAPER" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <uses-feature android:name="android.software.live_wallpaper" android:required="true" />
              <uses-feature android:name="android.hardware.sensor.accelerometer" android:required="false" />
              <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="subject_segment" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.DepthWallpaperService"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_WALLPAPER"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF

          # 7. ClockConfig.kt
          cat << 'EOF' > app/src/main/java/com/example/depthlockscreen/data/model/ClockConfig.kt
          package com.example.depthlockscreen.data.model

          import android.graphics.Color

          data class ClockConfig(
              val isClockVisible: Boolean = true,
              val isBehindSubject: Boolean = true,
              val colorArgb: Int = Color.WHITE,
              val fontSizeSp: Float = 88f,
              val verticalBias: Float = 0.24f,
              val is24HourFormat: Boolean = true,
              val parallaxStrength: Float = 1.0f,
              val fontFamily: String = "DEFAULT_BOLD"
          ) {
              companion object {
                  val DEFAULT = ClockConfig()
              }
          }
          EOF

          # 8. WallpaperRepository.kt
          cat << 'EOF' > app/src/main/java/com/example/depthlockscreen/data/repository/WallpaperRepository.kt
          package com.example.depthlockscreen.data.repository

          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.*
          import com.example.depthlockscreen.data.model.ClockConfig
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream
          import kotlin.math.max

          class WallpaperRepository(private val context: Context) {
              private val prefs: SharedPreferences = context.getSharedPreferences("depth_wallpaper_prefs", Context.MODE_PRIVATE)

              suspend fun saveAssets(background: Bitmap, foreground: Bitmap, config: ClockConfig) = withContext(Dispatchers.IO) {
                  val optBg = downscaleBitmap(background, 1280)
                  val optFg = downscaleBitmap(foreground, 1280)
                  val bgFile = File(context.filesDir, "bg_layer.png")
                  val fgFile = File(context.filesDir, "fg_subject.png")
                  FileOutputStream(bgFile).use { optBg.compress(Bitmap.CompressFormat.PNG, 95, it) }
                  FileOutputStream(fgFile).use { optFg.compress(Bitmap.CompressFormat.PNG, 95, it) }
                  saveClockConfig(config)
              }

              fun saveClockConfig(config: ClockConfig) {
                  prefs.edit()
                      .putBoolean("isClockVisible", config.isClockVisible)
                      .putBoolean("isBehindSubject", config.isBehindSubject)
                      .putInt("colorArgb", config.colorArgb)
                      .putFloat("fontSizeSp", config.fontSizeSp)
                      .putFloat("verticalBias", config.verticalBias)
                      .putBoolean("is24HourFormat", config.is24HourFormat)
                      .putFloat("parallaxStrength", config.parallaxStrength)
                      .putString("fontFamily", config.fontFamily)
                      .apply()
              }

              suspend fun loadBackgroundBitmap(): Bitmap? = withContext(Dispatchers.IO) {
                  try {
                      val file = File(context.filesDir, "bg_layer.png")
                      if (file.exists()) {
                          BitmapFactory.decodeFile(file.absolutePath) ?: generatePresetBg("CYBERPUNK")
                      } else {
                          generatePresetBg("CYBERPUNK")
                      }
                  } catch (e: Exception) {
                      generatePresetBg("CYBERPUNK")
                  }
              }

              suspend fun loadForegroundBitmap(): Bitmap? = withContext(Dispatchers.IO) {
                  try {
                      val file = File(context.filesDir, "fg_subject.png")
                      if (file.exists()) {
                          BitmapFactory.decodeFile(file.absolutePath) ?: generatePresetFg("CYBERPUNK")
                      } else {
                          generatePresetFg("CYBERPUNK")
                      }
                  } catch (e: Exception) {
                      generatePresetFg("CYBERPUNK")
                  }
              }

              fun loadSavedClockConfig(): ClockConfig {
                  return ClockConfig(
                      isClockVisible = prefs.getBoolean("isClockVisible", true),
                      isBehindSubject = prefs.getBoolean("isBehindSubject", true),
                      colorArgb = prefs.getInt("colorArgb", Color.WHITE),
                      fontSizeSp = prefs.getFloat("fontSizeSp", 88f),
                      verticalBias = prefs.getFloat("verticalBias", 0.24f),
                      is24HourFormat = prefs.getBoolean("is24HourFormat", true),
                      parallaxStrength = prefs.getFloat("parallaxStrength", 1.0f),
                      fontFamily = prefs.getString("fontFamily", "DEFAULT_BOLD") ?: "DEFAULT_BOLD"
                  )
              }

              suspend fun applyPreset(presetId: String) = withContext(Dispatchers.IO) {
                  val bg = generatePresetBg(presetId)
                  val fg = generatePresetFg(presetId)
                  val config = when (presetId) {
                      "ALPINE_EAGLE" -> ClockConfig(
                          isClockVisible = true,
                          isBehindSubject = true,
                          colorArgb = Color.WHITE,
                          fontSizeSp = 86f,
                          verticalBias = 0.22f,
                          parallaxStrength = 1.2f,
                          fontFamily = "SERIF"
                      )
                      "SUNSET_HORIZON" -> ClockConfig(
                          isClockVisible = true,
                          isBehindSubject = true,
                          colorArgb = Color.parseColor("#FFE082"),
                          fontSizeSp = 90f,
                          verticalBias = 0.25f,
                          parallaxStrength = 1.0f,
                          fontFamily = "DEFAULT_BOLD"
                      )
                      else -> ClockConfig(
                          isClockVisible = true,
                          isBehindSubject = true,
                          colorArgb = Color.parseColor("#38BDF8"),
                          fontSizeSp = 88f,
                          verticalBias = 0.24f,
                          parallaxStrength = 1.1f,
                          fontFamily = "MONOSPACE"
                      )
                  }
                  saveAssets(bg, fg, config)
              }

              fun downscaleBitmap(source: Bitmap, maxDim: Int = 1280): Bitmap {
                  val w = source.width
                  val h = source.height
                  if (w <= maxDim && h <= maxDim) return source
                  val ratio = w.toFloat() / h.toFloat()
                  val newW = if (ratio > 1f) maxDim else (maxDim * ratio).toInt()
                  val newH = if (ratio > 1f) (maxDim / ratio).toInt() else maxDim
                  return Bitmap.createScaledBitmap(source, max(1, newW), max(1, newH), true)
              }

              fun generatePresetBg(presetId: String): Bitmap {
                  val bmp = Bitmap.createBitmap(720, 1280, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG)

                  when (presetId) {
                      "ALPINE_EAGLE" -> {
                          // سماء جبلية شفقية
                          paint.shader = LinearGradient(0f, 0f, 0f, 1280f,
                              intArrayOf(Color.parseColor("#0F172A"), Color.parseColor("#1E1B4B"), Color.parseColor("#4C1D95"), Color.parseColor("#090D16")),
                              floatArrayOf(0f, 0.35f, 0.75f, 1f), Shader.TileMode.CLAMP)
                          canvas.drawRect(0f, 0f, 720f, 1280f, paint)
                          paint.shader = null

                          // قمم جبلية داكنة
                          paint.color = Color.parseColor("#1E293B")
                          val mountain = Path().apply {
                              moveTo(0f, 850f)
                              lineTo(200f, 620f)
                              lineTo(380f, 780f)
                              lineTo(540f, 580f)
                              lineTo(720f, 750f)
                              lineTo(720f, 1280f)
                              lineTo(0f, 1280f)
                              close()
                          }
                          canvas.drawPath(mountain, paint)

                          // ضباب دافئ في الوادي
                          paint.shader = LinearGradient(0f, 750f, 0f, 1280f,
                              Color.parseColor("#38BDF8"), Color.TRANSPARENT, Shader.TileMode.CLAMP)
                          paint.alpha = 50
                          canvas.drawRect(0f, 750f, 720f, 1280f, paint)
                      }
                      "SUNSET_HORIZON" -> {
                          // شفق الغروب الساحر
                          paint.shader = LinearGradient(0f, 0f, 0f, 1280f,
                              intArrayOf(Color.parseColor("#451A03"), Color.parseColor("#7C2D12"), Color.parseColor("#9A3412"), Color.parseColor("#18181B")),
                              floatArrayOf(0f, 0.4f, 0.7f, 1f), Shader.TileMode.CLAMP)
                          canvas.drawRect(0f, 0f, 720f, 1280f, paint)
                          paint.shader = null

                          // قرص الشمس الذهبية
                          paint.color = Color.parseColor("#FDE047")
                          paint.alpha = 230
                          canvas.drawCircle(360f, 680f, 110f, paint)

                          // أفق البحر المعتم
                          paint.color = Color.parseColor("#090D16")
                          canvas.drawRect(0f, 740f, 720f, 1280f, paint)
                      }
                      else -> {
                          // Cyberpunk City Preset
                          paint.shader = LinearGradient(0f, 0f, 0f, 1280f,
                              intArrayOf(Color.parseColor("#090D16"), Color.parseColor("#1E1B4B"), Color.parseColor("#311042"), Color.parseColor("#050811")),
                              floatArrayOf(0f, 0.4f, 0.75f, 1f), Shader.TileMode.CLAMP)
                          canvas.drawRect(0f, 0f, 720f, 1280f, paint)
                          paint.shader = null

                          // أبراج ناطحات سحاب
                          paint.color = Color.parseColor("#0F172A")
                          canvas.drawRect(60f, 580f, 250f, 1280f, paint)
                          canvas.drawRect(290f, 480f, 490f, 1280f, paint)
                          canvas.drawRect(510f, 620f, 680f, 1280f, paint)

                          // نوافذ نيون مشعة
                          paint.color = Color.parseColor("#38BDF8")
                          paint.alpha = 150
                          for (y in 540..1120 step 42) {
                              canvas.drawCircle(340f, y.toFloat(), 3.5f, paint)
                              canvas.drawCircle(440f, y.toFloat(), 3.5f, paint)
                          }
                      }
                  }
                  return bmp
              }

              fun generatePresetFg(presetId: String): Bitmap {
                  val bmp = Bitmap.createBitmap(720, 1280, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG)

                  when (presetId) {
                      "ALPINE_EAGLE" -> {
                          // صقر/نسر طائر بأجنحة عملاقة في المقدمة
                          paint.color = Color.parseColor("#E2E8F0")
                          val wing = Path().apply {
                              moveTo(360f, 470f)
                              quadTo(200f, 320f, 80f, 440f)
                              quadTo(240f, 500f, 360f, 580f)
                              quadTo(480f, 500f, 640f, 440f)
                              quadTo(520f, 320f, 360f, 470f)
                              close()
                          }
                          canvas.drawPath(wing, paint)

                          paint.color = Color.parseColor("#CBD5E1")
                          canvas.drawCircle(360f, 490f, 45f, paint)
                          paint.color = Color.parseColor("#F59E0B")
                          canvas.drawCircle(360f, 520f, 14f, paint)
                      }
                      "SUNSET_HORIZON" -> {
                          // نخلة أو شجرة كلاسيكية ظلية في المقدمة
                          paint.color = Color.parseColor("#090D16")
                          val trunk = Path().apply {
                              moveTo(350f, 1280f)
                              quadTo(370f, 750f, 360f, 450f)
                              lineTo(380f, 450f)
                              quadTo(390f, 750f, 380f, 1280f)
                              close()
                          }
                          canvas.drawPath(trunk, paint)
                          // سعف النخيل الممتد
                          paint.strokeWidth = 16f
                          paint.style = Paint.Style.STROKE
                          canvas.drawArc(RectF(160f, 350f, 560f, 580f), 180f, 180f, false, paint)
                          canvas.drawArc(RectF(120f, 380f, 600f, 640f), 190f, 160f, false, paint)
                      }
                      else -> {
                          // شخصية Cyberpunk عصرية مع تأثير النيون
                          paint.color = Color.parseColor("#E11D48")
                          val path = Path().apply {
                              moveTo(360f, 430f)
                              quadTo(460f, 430f, 480f, 570f)
                              quadTo(520f, 750f, 540f, 1280f)
                              lineTo(180f, 1280f)
                              quadTo(200f, 750f, 240f, 570f)
                              quadTo(260f, 430f, 360f, 430f)
                              close()
                          }
                          canvas.drawPath(path, paint)

                          // هودي الرأس العصري
                          paint.color = Color.parseColor("#FDA4AF")
                          canvas.drawCircle(360f, 400f, 72f, paint)
                          paint.color = Color.parseColor("#38BDF8")
                          canvas.drawCircle(360f, 410f, 30f, paint)
                      }
                  }
                  return bmp
              }
          }
          EOF

          # 9. SubjectSegmenterHelper.kt
          cat << 'EOF' > app/src/main/java/com/example/depthlockscreen/ml/SubjectSegmenterHelper.kt
          package com.example.depthlockscreen.ml

          import android.content.Context
          import android.graphics.*
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.segmentation.subject.SubjectSegmentation
          import com.google.mlkit.vision.segmentation.subject.SubjectSegmenterOptions
          import kotlinx.coroutines.tasks.await

          class SubjectSegmenterHelper(context: Context) {
              private val options = SubjectSegmenterOptions.Builder()
                  .enableForegroundBitmap()
                  .build()
              private val segmenter = SubjectSegmentation.getClient(options)

              suspend fun extractForegroundSubject(originalBitmap: Bitmap): Bitmap {
                  // 1. تجربة عزل الذكاء الاصطناعي فائق الدقة من Google ML Kit
                  try {
                      val inputImage = InputImage.fromBitmap(originalBitmap, 0)
                      val result = segmenter.process(inputImage).await()
                      val fg = result.foregroundBitmap
                      if (fg != null) {
                          return fg
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }

                  // 2. نظام عزل فوري ذكي واحتياطي (Smart Focal Masking) لا يفشل أبداً
                  // يضمن ظهور العمق 3D فوراً حتى لو كان موديل Google لا يزال قيد التحميل في الخلفية
                  return generateFocalCutout(originalBitmap)
              }

              private fun generateFocalCutout(original: Bitmap): Bitmap {
                  val result = Bitmap.createBitmap(original.width, original.height, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(result)
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  canvas.drawBitmap(original, 0f, 0f, paint)

                  val maskPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      xfermode = PorterDuffXfermode(PorterDuff.Mode.DST_IN)
                      shader = RadialGradient(
                          original.width / 2f,
                          original.height * 0.65f,
                          original.width * 0.55f,
                          intArrayOf(Color.BLACK, Color.BLACK, Color.TRANSPARENT),
                          floatArrayOf(0f, 0.62f, 1f),
                          Shader.TileMode.CLAMP
                      )
                  }
                  canvas.drawRect(0f, 0f, original.width.toFloat(), original.height.toFloat(), maskPaint)
                  return result
              }
          }
          EOF

          # 10. DepthWallpaperService.kt
          cat << 'EOF' > app/src/main/java/com/example/depthlockscreen/service/DepthWallpaperService.kt
          package com.example.depthlockscreen.service

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.*
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Build
          import android.os.SystemClock
          import android.service.wallpaper.WallpaperService
          import android.view.SurfaceHolder
          import com.example.depthlockscreen.data.model.ClockConfig
          import com.example.depthlockscreen.data.repository.WallpaperRepository
          import kotlinx.coroutines.*
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.max
          import kotlin.math.sin

          class DepthWallpaperService : WallpaperService() {
              override fun onCreateEngine(): Engine = DepthEngine()

              inner class DepthEngine : Engine(), SensorEventListener {
                  private var serviceScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
                  private lateinit var repository: WallpaperRepository
                  private var currentHolder: SurfaceHolder? = null
                  private var isScreenVisible = false
                  private var loadJob: Job? = null

                  private val sensorManager by lazy { getSystemService(Context.SENSOR_SERVICE) as SensorManager }
                  private val rotationSensor by lazy {
                      sensorManager.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR)
                          ?: sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)
                  }

                  private val rotationMatrix = FloatArray(9)
                  private val orientationAngles = FloatArray(3)
                  private var rawRoll = 0f
                  private var rawPitch = 0f
                  private var smoothRoll = 0f
                  private var smoothPitch = 0f
                  private val filterAlpha = 0.14f

                  private var backgroundBitmap: Bitmap? = null
                  private var foregroundBitmap: Bitmap? = null
                  private var clockConfig: ClockConfig = ClockConfig.DEFAULT

                  private val bitmapPaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
                  private val clockPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { textAlign = Paint.Align.CENTER }
                  private val datePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { textAlign = Paint.Align.CENTER }

                  // تنظيم استدعاءات الرسم لتوفير البطارية ومنع الـ Lag (معدل 60 إطار بالثانية)
                  private var lastFrameTime = 0L
                  private val frameIntervalMs = 16L

                  private val timeTickReceiver = object : BroadcastReceiver() {
                      override fun onReceive(context: Context?, intent: Intent?) { 
                          drawFrame() 
                      }
                  }
                  private var isReceiverRegistered = false

                  override fun onCreate(holder: SurfaceHolder) {
                      super.onCreate(holder)
                      this.currentHolder = holder
                      repository = WallpaperRepository(applicationContext)
                      loadSavedAssets()
                  }

                  override fun onSurfaceCreated(holder: SurfaceHolder) {
                      super.onSurfaceCreated(holder)
                      this.currentHolder = holder
                      loadSavedAssets()
                  }

                  override fun onVisibilityChanged(visible: Boolean) {
                      super.onVisibilityChanged(visible)
                      this.isScreenVisible = visible
                      if (visible) {
                          registerTimeReceiver()
                          rotationSensor?.let { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_UI) }
                          loadSavedAssets()
                          drawFrame()
                      } else {
                          unregisterTimeReceiver()
                          sensorManager.unregisterListener(this)
                      }
                  }

                  private fun registerTimeReceiver() {
                      if (!isReceiverRegistered) {
                          val filter = IntentFilter().apply {
                              addAction(Intent.ACTION_TIME_TICK)
                              addAction(Intent.ACTION_TIME_CHANGED)
                              addAction(Intent.ACTION_TIMEZONE_CHANGED)
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              this@DepthWallpaperService.registerReceiver(timeTickReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                          } else {
                              this@DepthWallpaperService.registerReceiver(timeTickReceiver, filter)
                          }
                          isReceiverRegistered = true
                      }
                  }

                  private fun unregisterTimeReceiver() {
                      if (isReceiverRegistered) {
                          try { 
                              this@DepthWallpaperService.unregisterReceiver(timeTickReceiver) 
                          } catch (e: Exception) {}
                          isReceiverRegistered = false
                      }
                  }

                  override fun onSurfaceDestroyed(holder: SurfaceHolder) {
                      super.onSurfaceDestroyed(holder)
                      isScreenVisible = false
                      unregisterTimeReceiver()
                      sensorManager.unregisterListener(this)
                      loadJob?.cancel()
                  }

                  override fun onDestroy() {
                      super.onDestroy()
                      serviceScope.cancel()
                  }

                  override fun onSensorChanged(event: SensorEvent) {
                      if (!isScreenVisible) return
                      val now = SystemClock.uptimeMillis()
                      if (now - lastFrameTime < frameIntervalMs) return

                      if (event.sensor.type == Sensor.TYPE_ROTATION_VECTOR) {
                          SensorManager.getRotationMatrixFromVector(rotationMatrix, event.values)
                          SensorManager.getOrientation(rotationMatrix, orientationAngles)
                          val targetRoll = sin(orientationAngles[2])
                          val targetPitch = sin(orientationAngles[1])
                          rawRoll += filterAlpha * (targetRoll - rawRoll)
                          rawPitch += filterAlpha * (targetPitch - rawPitch)
                          drawFrame()
                          lastFrameTime = now
                      }
                  }

                  override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

                  private fun loadSavedAssets() {
                      loadJob?.cancel()
                      loadJob = serviceScope.launch(Dispatchers.IO) {
                          val config = repository.loadSavedClockConfig()
                          val bg = repository.loadBackgroundBitmap()
                          val fg = repository.loadForegroundBitmap()
                          withContext(Dispatchers.Main) {
                              clockConfig = config
                              backgroundBitmap = bg
                              foregroundBitmap = fg
                              drawFrame()
                          }
                      }
                  }

                  private fun drawFrame() {
                      if (!isScreenVisible) return
                      val holder = currentHolder ?: return
                      var canvas: Canvas? = null
                      try {
                          // تسريع عتادي مباشر عبر كارت الشاشة GPU لمنع الـ Lag تماماً
                          canvas = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              holder.lockHardwareCanvas()
                          } else {
                              holder.lockCanvas()
                          }
                          if (canvas != null) {
                              renderLayers(canvas)
                          }
                      } catch (e: Exception) {
                          // fallback في حال لم يدعم الجهاز الـ Hardware Canvas
                          try {
                              canvas = holder.lockCanvas()
                              if (canvas != null) renderLayers(canvas)
                          } catch (e2: Exception) {}
                      } finally {
                          if (canvas != null) {
                              try { 
                                  holder.unlockCanvasAndPost(canvas) 
                              } catch (e: Exception) {}
                          }
                      }
                  }

                  private fun renderLayers(canvas: Canvas) {
                      val canvasW = canvas.width.toFloat()
                      val canvasH = canvas.height.toFloat()
                      if (canvasW <= 0 || canvasH <= 0) return

                      smoothRoll += (rawRoll - smoothRoll) * 0.15f
                      smoothPitch += (rawPitch - smoothPitch) * 0.15f

                      val baseParallax = 34f * clockConfig.parallaxStrength
                      val offsetX = (smoothRoll * baseParallax).coerceIn(-baseParallax, baseParallax)
                      val offsetY = (smoothPitch * baseParallax).coerceIn(-baseParallax, baseParallax)

                      val bg = backgroundBitmap
                      val fg = foregroundBitmap

                      // حماية ضد الشاشة السوداء نهائياً: رسم تدرج داكن فخم إذا لم تكتمل الصورة
                      if (bg != null) {
                          drawScaledBitmap(canvas, bg, canvasW, canvasH, 1.14f, -offsetX * 0.35f, -offsetY * 0.35f)
                      } else {
                          val fallbackPaint = Paint()
                          fallbackPaint.shader = LinearGradient(0f, 0f, 0f, canvasH,
                              intArrayOf(Color.parseColor("#0F172A"), Color.parseColor("#070B14")),
                              null, Shader.TileMode.CLAMP)
                          canvas.drawRect(0f, 0f, canvasW, canvasH, fallbackPaint)
                      }

                      if (clockConfig.isClockVisible && clockConfig.isBehindSubject) {
                          drawClock(canvas, canvasW, canvasH, offsetX * 0.18f, offsetY * 0.18f)
                      }
                      if (fg != null) {
                          drawScaledBitmap(canvas, fg, canvasW, canvasH, 1.05f, offsetX * 0.75f, offsetY * 0.75f)
                      }
                      if (clockConfig.isClockVisible && !clockConfig.isBehindSubject) {
                          drawClock(canvas, canvasW, canvasH, offsetX * 0.18f, offsetY * 0.18f)
                      }
                  }

                  private fun drawClock(canvas: Canvas, canvasW: Float, canvasH: Float, transX: Float, transY: Float) {
                      val timeFormat = if (clockConfig.is24HourFormat) "HH:mm" else "hh:mm"
                      val timeStr = SimpleDateFormat(timeFormat, Locale.getDefault()).format(Date())
                      val dateStr = SimpleDateFormat("EEEE، d MMMM", Locale("ar")).format(Date())
                      val textSizePx = clockConfig.fontSizeSp * this@DepthWallpaperService.resources.displayMetrics.scaledDensity

                      clockPaint.color = clockConfig.colorArgb
                      clockPaint.textSize = textSizePx
                      clockPaint.typeface = when (clockConfig.fontFamily) {
                          "SERIF" -> Typeface.create(Typeface.SERIF, Typeface.BOLD)
                          "MONOSPACE" -> Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                          "SANS_SERIF" -> Typeface.create(Typeface.SANS_SERIF, Typeface.NORMAL)
                          else -> Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                      }

                      datePaint.color = clockConfig.colorArgb
                      datePaint.alpha = 210
                      datePaint.textSize = textSizePx * 0.22f

                      val centerX = (canvasW / 2f) + transX
                      val centerY = (canvasH * clockConfig.verticalBias) + transY

                      canvas.drawText(timeStr, centerX, centerY, clockPaint)
                      canvas.drawText(dateStr, centerX, centerY + (textSizePx * 0.35f), datePaint)
                  }

                  private fun drawScaledBitmap(canvas: Canvas, bitmap: Bitmap, canvasW: Float, canvasH: Float, zoom: Float, transX: Float, transY: Float) {
                      val bmpW = bitmap.width.toFloat()
                      val bmpH = bitmap.height.toFloat()
                      val scale = max(canvasW / bmpW, canvasH / bmpH) * zoom
                      val scaledW = bmpW * scale
                      val scaledH = bmpH * scale
                      val left = (canvasW - scaledW) / 2f + transX
                      val top = (canvasH - scaledH) / 2f + transY
                      val destRect = RectF(left, top, left + scaledW, top + scaledH)
                      val srcRect = Rect(0, 0, bitmap.width, bitmap.height)
                      canvas.drawBitmap(bitmap, srcRect, destRect, bitmapPaint)
                  }
              }
          }
