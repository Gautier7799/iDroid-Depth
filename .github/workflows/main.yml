name: Build iDroid-Depth APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m"

    steps:
      # 1. سحب كود المشروع من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17 الحديثة
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد بيئة Gradle الرسمية وتجاوز أي نقص في الملفات
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. بناء ملف الـ APK بنمط Debug وتوفير الذاكرة
      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      # 5. رفع ملف الـ APK لتنزيله وتثبيته فوراً على الهاتف
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iDroid-Depth-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
