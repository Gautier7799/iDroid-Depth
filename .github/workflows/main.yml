name: Build iDroid-Depth APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. تثبيت وضبط Gradle 8.5 الرسمي
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # 4. توليد هيكل وأكواد مشروع الأندرويد كاملة مع الواجهة الاحترافية
      - name: Scaffold Android Project
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/example/depthlockscreen/data/model
          mkdir -p app/src/main/java/com/example/depthlockscreen/data/repository
          mkdir -p app/src/main/java/com/example/depthlockscreen/ml
          mkdir -p app/src/main/java/com/example/depthlockscreen/service
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # قبول تراخيص Android SDK وتحديد مسار الـ SDK
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a32ee33ef4a11043e690b4f7462" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"

          # تفعيل AndroidX وضبط إعدادات الذاكرة
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "iDroid-Depth"
          include(":app")
          EOF

          # 2. build.gradle.kts (المستوى الجذري)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 3. gradle-wrapper.properties
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.depthlockscreen"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.depthlockscreen"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1.0"
              }

              buildTypes {
                  debug {
                      applicationIdSuffix = ".debug"
                      isDebuggable = true
                  }
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              
              // ML Kit Segmentation
              implementation("com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1")
              implementation("com.google.mlkit:vision-common:17.3.0")
              
              // Coroutines
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3")
          }
          EOF

          # 5. Strings & Wallpaper XML
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">iDroid Depth</string>
              <string name="wallpaper_author">Gautier Studio</string>
              <string name="wallpaper_description">3D Depth Effect Live Wallpaper with Parallax and Clock</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/wallpaper.xml
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/wallpaper_description"
              android:author="@string/wallpaper_author"
              android:settingsActivity="com.example.depthlockscreen.MainActivity" />
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.live_wallpaper" android:required="true" />
              <uses-feature android:name="android.hardware.sensor.accelerometer" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="subject_segment" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.DepthWallpaperService"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_WALLPAPER"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF

          # 7. ClockConfig.kt
          cat << 'EOF' > app/src/main/java/com/example/depthlockscreen/data/model/ClockConfig.kt
          package com.example.depthlockscreen.data.model

          import android.graphics.Color

          data class ClockConfig(
              val isClockVisible: Boolean = true,
              val isBehindSubject: Boolean = true,
              val colorArgb: Int = Color.WHITE,
              val fontSizeSp: Float = 88f,
              val verticalBias: Float = 0.24f,
              val is24HourFormat: Boolean = true,
              val parallaxStrength: Float = 1.0f
          ) {
              companion object {
                  val DEFAULT = ClockConfig()
              }
          }
          EOF

          # 8. WallpaperRepository.kt
          cat << 'EOF' > app/src/main/java/com/example/depthlockscreen/data/repository/WallpaperRepository.kt
          package com.example.depthlockscreen.data.repository

          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import com.example.depthlockscreen.data.model.ClockConfig
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream

          class WallpaperRepository(private val context: Context) {
              private val prefs: SharedPreferences = context.getSharedPreferences("depth_wallpaper_prefs", Context.MODE_PRIVATE)

              suspend fun saveAssets(background: Bitmap, foreground: Bitmap, config: ClockConfig) = withContext(Dispatchers.IO) {
                  val bgFile = File(context.filesDir, "bg_layer.png")
                  val fgFile = File(context.filesDir, "fg_subject.png")
                  FileOutputStream(bgFile).use { background.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  FileOutputStream(fgFile).use { foreground.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  saveClockConfig(config)
              }

              fun saveClockConfig(config: ClockConfig) {
                  prefs.edit()
                      .putBoolean("isClockVisible", config.isClockVisible)
                      .putBoolean("isBehindSubject", config.isBehindSubject)
                      .putInt("colorArgb", config.colorArgb)
                      .putFloat("fontSizeSp", config.fontSizeSp)
                      .putFloat("verticalBias", config.verticalBias)
                      .putBoolean("is24HourFormat", config.is24HourFormat)
                      .putFloat("parallaxStrength", config.parallaxStrength)
                      .apply()
              }

              suspend fun loadBackgroundBitmap(): Bitmap? = withContext(Dispatchers.IO) {
                  val file = File(context.filesDir, "bg_layer.png")
                  if (file.exists()) BitmapFactory.decodeFile(file.absolutePath) else null
              }

              suspend fun loadForegroundBitmap(): Bitmap? = withContext(Dispatchers.IO) {
                  val file = File(context.filesDir, "fg_subject.png")
                  if (file.exists()) BitmapFactory.decodeFile(file.absolutePath) else null
              }

              fun loadSavedClockConfig(): ClockConfig {
                  return ClockConfig(
                      isClockVisible = prefs.getBoolean("isClockVisible", true),
                      isBehindSubject = prefs.getBoolean("isBehindSubject", true),
                      colorArgb = prefs.getInt("colorArgb", Color.WHITE),
                      fontSizeSp = prefs.getFloat("fontSizeSp", 88f),
                      verticalBias = prefs.getFloat("verticalBias", 0.24f),
                      is24HourFormat = prefs.getBoolean("is24HourFormat", true),
                      parallaxStrength = prefs.getFloat("parallaxStrength", 1.0f)
                  )
              }
          }
          EOF

          # 9. SubjectSegmenterHelper.kt
          cat << 'EOF' > app/src/main/java/com/example/depthlockscreen/ml/SubjectSegmenterHelper.kt
          package com.example.depthlockscreen.ml

          import android.content.Context
          import android.graphics.Bitmap
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.segmentation.subject.SubjectSegmentation
          import com.google.mlkit.vision.segmentation.subject.SubjectSegmenterOptions
          import kotlinx.coroutines.tasks.await

          class SubjectSegmenterHelper(context: Context) {
              private val options = SubjectSegmenterOptions.Builder()
                  .enableForegroundBitmap()
                  .build()
              private val segmenter = SubjectSegmentation.getClient(options)

              suspend fun extractForegroundSubject(originalBitmap: Bitmap): Bitmap? {
                  return try {
                      val inputImage = InputImage.fromBitmap(originalBitmap, 0)
                      val result = segmenter.process(inputImage).await()
                      result.foregroundBitmap
                  } catch (e: Exception) {
                      e.printStackTrace()
                      null
                  }
              }
          }
          EOF

          # 10. DepthWallpaperService.kt
          cat << 'EOF' > app/src/main/java/com/example/depthlockscreen/service/DepthWallpaperService.kt
          package com.example.depthlockscreen.service

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.*
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Build
          import android.service.wallpaper.WallpaperService
          import android.view.SurfaceHolder
          import com.example.depthlockscreen.data.model.ClockConfig
          import com.example.depthlockscreen.data.repository.WallpaperRepository
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.math.max
          import kotlin.math.sin

          class DepthWallpaperService : WallpaperService() {
              override fun onCreateEngine(): Engine = DepthEngine()

              inner class DepthEngine : Engine(), SensorEventListener {
                  private val serviceScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
                  private lateinit var repository: WallpaperRepository
                  private var currentHolder: SurfaceHolder? = null
                  private var isScreenVisible = false

                  private val sensorManager by lazy { getSystemService(Context.SENSOR_SERVICE) as SensorManager }
                  private val rotationSensor by lazy {
                      sensorManager.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR)
                          ?: sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)
                  }

                  private val rotationMatrix = FloatArray(9)
                  private val orientationAngles = FloatArray(3)
                  private var rawRoll = 0f
                  private var rawPitch = 0f
                  private var smoothRoll = 0f
                  private var smoothPitch = 0f
                  private val filterAlpha = 0.12f

                  private var backgroundBitmap: Bitmap? = null
                  private var foregroundBitmap: Bitmap? = null
                  private var clockConfig: ClockConfig = ClockConfig.DEFAULT

                  private val bitmapPaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
                  private val clockPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { textAlign = Paint.Align.CENTER }
                  private val datePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { textAlign = Paint.Align.CENTER }

                  private val timeTickReceiver = object : BroadcastReceiver() {
                      override fun onReceive(context: Context?, intent: Intent?) { 
                          drawFrame() 
                      }
                  }
                  private var isReceiverRegistered = false

                  override fun onCreate(holder: SurfaceHolder) {
                      super.onCreate(holder)
                      this.currentHolder = holder
                      repository = WallpaperRepository(applicationContext)
                      loadSavedAssets()
                  }

                  override fun onVisibilityChanged(visible: Boolean) {
                      super.onVisibilityChanged(visible)
                      this.isScreenVisible = visible
                      if (visible) {
                          registerTimeReceiver()
                          rotationSensor?.let { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME) }
                          loadSavedAssets()
                          drawFrame()
                      } else {
                          unregisterTimeReceiver()
                          sensorManager.unregisterListener(this)
                      }
                  }

                  private fun registerTimeReceiver() {
                      if (!isReceiverRegistered) {
                          val filter = IntentFilter().apply {
                              addAction(Intent.ACTION_TIME_TICK)
                              addAction(Intent.ACTION_TIME_CHANGED)
                              addAction(Intent.ACTION_TIMEZONE_CHANGED)
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                              this@DepthWallpaperService.registerReceiver(timeTickReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                          } else {
                              this@DepthWallpaperService.registerReceiver(timeTickReceiver, filter)
                          }
                          isReceiverRegistered = true
                      }
                  }

                  private fun unregisterTimeReceiver() {
                      if (isReceiverRegistered) {
                          try { 
                              this@DepthWallpaperService.unregisterReceiver(timeTickReceiver) 
                          } catch (e: Exception) {}
                          isReceiverRegistered = false
                      }
                  }

                  override fun onSurfaceDestroyed(holder: SurfaceHolder) {
                      super.onSurfaceDestroyed(holder)
                      isScreenVisible = false
                      unregisterTimeReceiver()
                      sensorManager.unregisterListener(this)
                      serviceScope.cancel()
                  }

                  override fun onSensorChanged(event: SensorEvent) {
                      if (!isScreenVisible) return
                      if (event.sensor.type == Sensor.TYPE_ROTATION_VECTOR) {
                          SensorManager.getRotationMatrixFromVector(rotationMatrix, event.values)
                          SensorManager.getOrientation(rotationMatrix, orientationAngles)
                          val targetRoll = sin(orientationAngles[2])
                          val targetPitch = sin(orientationAngles[1])
                          rawRoll += filterAlpha * (targetRoll - rawRoll)
                          rawPitch += filterAlpha * (targetPitch - rawPitch)
                          drawFrame()
                      }
                  }

                  override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

                  private fun loadSavedAssets() {
                      serviceScope.launch {
                          clockConfig = repository.loadSavedClockConfig()
                          backgroundBitmap = repository.loadBackgroundBitmap()
                          foregroundBitmap = repository.loadForegroundBitmap()
                          drawFrame()
                      }
                  }

                  private fun drawFrame() {
                      if (!isScreenVisible) return
                      val holder = currentHolder ?: return
                      var canvas: Canvas? = null
                      try {
                          canvas = holder.lockCanvas()
                          if (canvas != null) {
                              renderLayers(canvas)
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      } finally {
                          if (canvas != null) {
                              try { 
                                  holder.unlockCanvasAndPost(canvas) 
                              } catch (e: Exception) {}
                          }
                      }
                  }

                  private fun renderLayers(canvas: Canvas) {
                      val canvasW = canvas.width.toFloat()
                      val canvasH = canvas.height.toFloat()
                      if (canvasW <= 0 || canvasH <= 0) return

                      smoothRoll += (rawRoll - smoothRoll) * 0.1f
                      smoothPitch += (rawPitch - smoothPitch) * 0.1f

                      val baseParallax = 36f * clockConfig.parallaxStrength
                      val offsetX = (smoothRoll * baseParallax).coerceIn(-baseParallax, baseParallax)
                      val offsetY = (smoothPitch * baseParallax).coerceIn(-baseParallax, baseParallax)

                      canvas.drawColor(Color.BLACK)

                      val bg = backgroundBitmap
                      val fg = foregroundBitmap

                      if (bg != null) {
                          drawScaledBitmap(canvas, bg, canvasW, canvasH, 1.15f, -offsetX * 0.35f, -offsetY * 0.35f)
                      }
                      if (clockConfig.isClockVisible && clockConfig.isBehindSubject) {
                          drawClock(canvas, canvasW, canvasH, offsetX * 0.2f, offsetY * 0.2f)
                      }
                      if (fg != null) {
                          drawScaledBitmap(canvas, fg, canvasW, canvasH, 1.05f, offsetX * 0.75f, offsetY * 0.75f)
                      }
                      if (clockConfig.isClockVisible && !clockConfig.isBehindSubject) {
                          drawClock(canvas, canvasW, canvasH, offsetX * 0.2f, offsetY * 0.2f)
                      }
                  }

                  private fun drawClock(canvas: Canvas, canvasW: Float, canvasH: Float, transX: Float, transY: Float) {
                      val timeFormat = if (clockConfig.is24HourFormat) "HH:mm" else "hh:mm"
                      val timeStr = SimpleDateFormat(timeFormat, Locale.getDefault()).format(Date())
                      val dateStr = SimpleDateFormat("EEEE، d MMMM", Locale("ar")).format(Date())
                      val textSizePx = clockConfig.fontSizeSp * this@DepthWallpaperService.resources.displayMetrics.scaledDensity

                      clockPaint.color = clockConfig.colorArgb
                      clockPaint.textSize = textSizePx
                      clockPaint.typeface = Typeface.create(Typeface.SANS_SERIF, Typeface.BOLD)

                      datePaint.color = clockConfig.colorArgb
                      datePaint.alpha = 210
                      datePaint.textSize = textSizePx * 0.22f

                      val centerX = (canvasW / 2f) + transX
                      val centerY = (canvasH * clockConfig.verticalBias) + transY

                      canvas.drawText(timeStr, centerX, centerY, clockPaint)
                      canvas.drawText(dateStr, centerX, centerY + (textSizePx * 0.35f), datePaint)
                  }

                  private fun drawScaledBitmap(canvas: Canvas, bitmap: Bitmap, canvasW: Float, canvasH: Float, zoom: Float, transX: Float, transY: Float) {
                      val bmpW = bitmap.width.toFloat()
                      val bmpH = bitmap.height.toFloat()
                      val scale = max(canvasW / bmpW, canvasH / bmpH) * zoom
                      val scaledW = bmpW * scale
                      val scaledH = bmpH * scale
                      val left = (canvasW - scaledW) / 2f + transX
                      val top = (canvasH - scaledH) / 2f + transY
                      val destRect = RectF(left, top, left + scaledW, top + scaledH)
                      val srcRect = Rect(0, 0, bitmap.width, bitmap.height)
                      canvas.drawBitmap(bitmap, srcRect, destRect, bitmapPaint)
                  }
              }
          }
          EOF

          # 11. MainActivity.kt (واجهة متطورة جداً تحاكي قفل شاشة أبل الفاخرة)
          cat << 'EOF' > app/src/main/java/com/example/depthlockscreen/MainActivity.kt
          package com.example.depthlockscreen

          import android.app.WallpaperManager
          import android.content.ActivityNotFoundException
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.ImageDecoder
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.PickVisualMediaRequest
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.graphics.toArgb
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.example.depthlockscreen.data.model.ClockConfig
          import com.example.depthlockscreen.data.repository.WallpaperRepository
          import com.example.depthlockscreen.ml.SubjectSegmenterHelper
          import com.example.depthlockscreen.service.DepthWallpaperService
          import kotlinx.coroutines.launch
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              primary = Color(0xFF6750A4),
                              secondary = Color(0xFF7D5260),
                              surface = Color(0xFF1C1B1F),
                              background = Color(0xFF141218)
                          )
                      ) {
                          Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              DepthAppContent()
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun DepthAppContent() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val repo = remember { WallpaperRepository(context) }
              val segmenter = remember { SubjectSegmenterHelper(context) }

              var bgBmp by remember { mutableStateOf<Bitmap?>(null) }
              var fgBmp by remember { mutableStateOf<Bitmap?>(null) }
              var isProcessing by remember { mutableStateOf(false) }
              var statusMessage by remember { mutableStateOf<String?>(null) }
              var clockConfig by remember { mutableStateOf(repo.loadSavedClockConfig()) }

              // تحميل الصور المحفوظة عند فتح التطبيق
              LaunchedEffect(Unit) {
                  bgBmp = repo.loadBackgroundBitmap()
                  fgBmp = repo.loadForegroundBitmap()
              }

              val colorPresets = remember {
                  listOf(
                      Color.White,
                      Color(0xFFFFE082), // Gold
                      Color(0xFFFF8A80), // Coral
                      Color(0xFF80D8FF), // Sky Blue
                      Color(0xFFB388FF), // Lavender
                      Color(0xFFA7FFEB), // Mint
                      Color(0xFFFFD180), // Peach
                      Color(0xFF37474F)  // Slate Dark
                  )
              }

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.PickVisualMedia()) { uri ->
                  uri?.let {
                      scope.launch {
                          isProcessing = true
                          statusMessage = "جاري قراءة الصورة وتجهيز العزل..."
                          try {
                              val bmp = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                                  ImageDecoder.decodeBitmap(ImageDecoder.createSource(context.contentResolver, it)) { decoder, _, _ ->
                                      decoder.allocator = ImageDecoder.ALLOCATOR_SOFTWARE
                                      decoder.isMutableRequired = true
                                  }
                              } else {
                                  @Suppress("DEPRECATION")
                                  MediaStore.Images.Media.getBitmap(context.contentResolver, it)
                              }
                              bgBmp = bmp
                              statusMessage = "جاري استخراج العناصر عبر الذكاء الاصطناعي 🧠..."
                              val fg = segmenter.extractForegroundSubject(bmp)
                              if (fg != null) {
                                  fgBmp = fg
                                  repo.saveAssets(bmp, fg, clockConfig)
                                  statusMessage = null
                                  Toast.makeText(context, "تم العزل والتجهيز بنجاح!", Toast.LENGTH_SHORT).show()
                              } else {
                                  fgBmp = null
                                  statusMessage = "لم يتم التعرف على أشخاص بوضوح، جاري حفظ الخلفية كاملة"
                                  repo.saveAssets(bmp, bmp, clockConfig)
                              }
                          } catch (e: Exception) {
                              statusMessage = "خطأ: ${e.localizedMessage}"
                          } finally {
                              isProcessing = false
                          }
                      }
                  }
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Text("iDroid Depth 3D", fontWeight = FontWeight.Bold, fontSize = 20.sp)
                          },
                          actions = {
                              IconButton(onClick = {
                                  picker.launch(PickVisualMediaRequest(ActivityResultContracts.PickVisualMedia.ImageOnly))
                              }) {
                                  Icon(Icons.Default.AddPhotoAlternate, contentDescription = "اختيار صورة")
                              }
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.surface)
                      )
                  },
                  bottomBar = {
                      Surface(
                          color = MaterialTheme.colorScheme.surface,
                          tonalElevation = 8.dp,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Button(
                                  onClick = { launchWallpaper(context) },
                                  modifier = Modifier.fillMaxWidth().height(54.dp),
                                  shape = RoundedCornerShape(16.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF6750A4))
                              ) {
                                  Icon(Icons.Default.Wallpaper, contentDescription = null)
                                  Spacer(modifier = Modifier.width(8.dp))
                                  Text("تثبيت كخلفية حية لشاشة القفل", fontSize = 16.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      }
                  }
              ) { paddingValues ->
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(paddingValues)
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 16.dp, vertical = 8.dp),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      // 1. معاينة شاشة القفل التفاعلية (Live Simulated Lockscreen Frame)
                      Box(
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(380.dp)
                              .clip(RoundedCornerShape(28.dp))
                              .background(Color.Black)
                              .border(2.dp, MaterialTheme.colorScheme.outlineVariant, RoundedCornerShape(28.dp)),
                          contentAlignment = Alignment.Center
                      ) {
                          if (bgBmp != null) {
                              // طبقة الخلفية
                              Image(
                                  bitmap = bgBmp!!.asImageBitmap(),
                                  contentDescription = null,
                                  contentScale = ContentScale.Crop,
                                  modifier = Modifier.fillMaxSize()
                              )

                              // طبقة الساعة خلف العنصر (إذا كان وضع العمق مفعلاً)
                              if (clockConfig.isClockVisible && clockConfig.isBehindSubject) {
                                  ClockViewPreview(clockConfig)
                              }

                              // طبقة العنصر المعزول
                              if (fgBmp != null) {
                                  Image(
                                      bitmap = fgBmp!!.asImageBitmap(),
                                      contentDescription = null,
                                      contentScale = ContentScale.Crop,
                                      modifier = Modifier.fillMaxSize()
                                  )
                              }

                              // طبقة الساعة أمام العنصر (إذا تم إلغاء وضع العمق)
                              if (clockConfig.isClockVisible && !clockConfig.isBehindSubject) {
                                  ClockViewPreview(clockConfig)
                              }
                          } else {
                              Column(
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  verticalArrangement = Arrangement.Center
                              ) {
                                  Icon(
                                      Icons.Default.ImageSearch,
                                      contentDescription = null,
                                      modifier = Modifier.size(56.dp),
                                      tint = Color.Gray
                                  )
                                  Spacer(modifier = Modifier.height(12.dp))
                                  Text(
                                      "اختر صورة من ألبومك لتفعيل عزل الذكاء الاصطناعي ومعاينة شاشة القفل",
                                      textAlign = TextAlign.Center,
                                      color = Color.LightGray,
                                      fontSize = 14.sp,
                                      modifier = Modifier.padding(horizontal = 24.dp)
                                  )
                              }
                          }

                          // مؤشر التحميل أثناء العزل
                          if (isProcessing) {
                              Surface(
                                  color = Color.Black.copy(alpha = 0.7f),
                                  modifier = Modifier.fillMaxSize()
                              ) {
                                  Column(
                                      horizontalAlignment = Alignment.CenterHorizontally,
                                      verticalArrangement = Arrangement.Center
                                  ) {
                                      CircularProgressIndicator(color = Color.White)
                                      Spacer(modifier = Modifier.height(12.dp))
                                      Text(statusMessage ?: "جاري المعالجة...", color = Color.White, fontSize = 14.sp)
                                  }
                              }
                          }
                      }

                      Spacer(modifier = Modifier.height(16.dp))

                      // 2. زر لاختيار صورة سريعة
                      OutlinedButton(
                          onClick = {
                              picker.launch(PickVisualMediaRequest(ActivityResultContracts.PickVisualMedia.ImageOnly))
                          },
                          modifier = Modifier.fillMaxWidth().height(48.dp),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Icon(Icons.Default.AutoAwesome, contentDescription = null)
                          Spacer(modifier = Modifier.width(8.dp))
                          Text("اختيار صورة أخرى وعزلها", fontWeight = FontWeight.Bold)
                      }

                      Spacer(modifier = Modifier.height(20.dp))

                      // 3. قسم إعدادات العمق والساعة
                      Card(
                          shape = RoundedCornerShape(20.dp),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text(
                                  "إعدادات العمق والساعة (Depth & Clock)",
                                  fontWeight = FontWeight.Bold,
                                  fontSize = 16.sp,
                                  color = MaterialTheme.colorScheme.primary
                              )

                              Spacer(modifier = Modifier.height(12.dp))

                              // مفتاح تفعيل وضع العمق (الساعة خلف العنصر)
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text("وضع العمق (الساعة خلف العنصر)", fontSize = 14.sp)
                                  Switch(
                                      checked = clockConfig.isBehindSubject,
                                      onCheckedChange = {
                                          clockConfig = clockConfig.copy(isBehindSubject = it)
                                          repo.saveClockConfig(clockConfig)
                                      }
                                  )
                              }

                              Divider(modifier = Modifier.padding(vertical = 12.dp), color = MaterialTheme.colorScheme.outlineVariant)

                              // سلايدر موضع الساعة الرأسي
                              Text("موضع الساعة الرأسي (لتمريرها خلف الرأس)", fontSize = 13.sp, color = Color.Gray)
                              Slider(
                                  value = clockConfig.verticalBias,
                                  onValueChange = {
                                      clockConfig = clockConfig.copy(verticalBias = it)
                                      repo.saveClockConfig(clockConfig)
                                  },
                                  valueRange = 0.10f..0.60f
                              )

                              Spacer(modifier = Modifier.height(8.dp))

                              // سلايدر حجم الساعة
                              Text("حجم خط الساعة (${clockConfig.fontSizeSp.toInt()} sp)", fontSize = 13.sp, color = Color.Gray)
                              Slider(
                                  value = clockConfig.fontSizeSp,
                                  onValueChange = {
                                      clockConfig = clockConfig.copy(fontSizeSp = it)
                                      repo.saveClockConfig(clockConfig)
                                  },
                                  valueRange = 50f..130f
                              )

                              Divider(modifier = Modifier.padding(vertical = 12.dp), color = MaterialTheme.colorScheme.outlineVariant)

                              // لوحة اختيار ألوان الساعة
                              Text("لون الساعة والتاريخ", fontSize = 13.sp, color = Color.Gray)
                              Spacer(modifier = Modifier.height(8.dp))
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween
                              ) {
                                  colorPresets.forEach { color ->
                                      val isSelected = clockConfig.colorArgb == color.toArgb()
                                      Box(
                                          modifier = Modifier
                                              .size(34.dp)
                                              .clip(CircleShape)
                                              .background(color)
                                              .clickable {
                                                  clockConfig = clockConfig.copy(colorArgb = color.toArgb())
                                                  repo.saveClockConfig(clockConfig)
                                              }
                                              .border(
                                                  width = if (isSelected) 3.dp else 1.dp,
                                                  color = if (isSelected) MaterialTheme.colorScheme.primary else Color.Gray,
                                                  shape = CircleShape
                                              )
                                      )
                                  }
                              }

                              Divider(modifier = Modifier.padding(vertical = 12.dp), color = MaterialTheme.colorScheme.outlineVariant)

                              // سلايدر حساسية الحركة المجسمة 3D Parallax
                              Text("قوة تأثير الحركة ثلاثية الأبعاد (3D Parallax)", fontSize = 13.sp, color = Color.Gray)
                              Slider(
                                  value = clockConfig.parallaxStrength,
                                  onValueChange = {
                                      clockConfig = clockConfig.copy(parallaxStrength = it)
                                      repo.saveClockConfig(clockConfig)
                                  },
                                  valueRange = 0.0f..2.5f
                              )

                              // مفتاح نظام 24 ساعة
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text("صيغة الوقت 24 ساعة", fontSize = 14.sp)
                                  Switch(
                                      checked = clockConfig.is24HourFormat,
                                      onCheckedChange = {
                                          clockConfig = clockConfig.copy(is24HourFormat = it)
                                          repo.saveClockConfig(clockConfig)
                                      }
                                  )
                              }
                          }
                      }

                      Spacer(modifier = Modifier.height(80.dp))
                  }
              }
          }

          @Composable
          fun ClockViewPreview(config: ClockConfig) {
              val timeFormat = if (config.is24HourFormat) "HH:mm" else "hh:mm"
              val timeStr = remember { SimpleDateFormat(timeFormat, Locale.getDefault()).format(Date()) }
              val dateStr = remember { SimpleDateFormat("EEEE، d MMMM", Locale("ar")).format(Date()) }

              Box(
                  modifier = Modifier.fillMaxSize(),
                  contentAlignment = Alignment.TopCenter
              ) {
                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally,
                      modifier = Modifier.padding(top = (380 * config.verticalBias).dp)
                  ) {
                      Text(
                          text = timeStr,
                          color = Color(config.colorArgb),
                          fontSize = (config.fontSizeSp * 0.55f).sp,
                          fontWeight = FontWeight.Bold,
                          letterSpacing = (-1).sp
                      )
                      Text(
                          text = dateStr,
                          color = Color(config.colorArgb).copy(alpha = 0.85f),
                          fontSize = 12.sp,
                          fontWeight = FontWeight.Medium
                      )
                  }
              }
          }

          fun launchWallpaper(context: Context) {
              try {
                  val intent = Intent(WallpaperManager.ACTION_CHANGE_LIVE_WALLPAPER).apply {
                      putExtra(WallpaperManager.EXTRA_LIVE_WALLPAPER_COMPONENT, ComponentName(context, DepthWallpaperService::class.java))
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  context.startActivity(intent)
              } catch (e: ActivityNotFoundException) {
                  try {
                      val intent = Intent(WallpaperManager.ACTION_LIVE_WALLPAPER_CHOOSER).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      }
                      context.startActivity(intent)
                  } catch (e2: Exception) {
                      Toast.makeText(context, "يرجى تعيين الخلفية من إعدادات شاشة الهاتف", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF

      # 5. بناء ملف الـ APK بنمط Debug عبر Gradle المباشر
      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      # 6. رفع ملف الـ APK الناتج للتحميل المباشر
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iDroid-Depth-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
